function fillTr(){const c=S.cu.find(x=>x.id==$('#ic').value);if(c&&c.tractor&&!$('#tr').value)$('#tr').value=c.tractor}
function newInv(id){EI=id||null;const i=EI?CUR.i:{};IL=EI?CUR.l.map(l=>({item_id:l.item_id,description:l.description,qty:l.qty,rate:l.rate,gst_rate:l.gst_rate})):[];
 modal(`<h3>${EI?'Edit '+e(i.number):'New invoice or estimate'}</h3>${EI&&n(i.paid)>0?'<p class=Pending>Payments are already recorded. Changes will change what the customer sees.</p>':''}<label>Type<select id=kd ${EI?'disabled':''}><option value=invoice ${i.kind!='quote'?'selected':''}>Invoice<option value=quote ${i.kind=='quote'?'selected':''}>Estimate (no stock change)</select></label><label>Customer<select id=ic onchange=fillTr()><option value="">Walk-in or new customer</option>${S.cu.map(c=>`<option value=${c.id} ${c.id==i.customer_id?'selected':''}>${e(c.name)}</option>`).join('')}</select></label><div class=row><input id=nn placeholder="New customer name"><input id=np placeholder=Phone></div><div class=row><input id=tr placeholder="Tractor model / reg. no." value="${e(i.tractor||'')}"><input id=mt placeholder="Meter (hours)" value="${e(i.meter||'')}"></div><h3>Bill items</h3><div id=ls></div><div id=tt></div><h3>Add materials or services</h3><input id=sq placeholder="Search materials or services" oninput=pk() style="width:100%"><div id=pk style="max-height:210px;overflow:auto"></div><div class=row><button onclick=addC()>+ Custom line</button></div>${EI?'<input id=rc type=hidden value=0>':'<label>Amount received now<input id=rc type=number step=any value=0></label>'}<label>Notes<input id=nt value="${e(i.notes||'')}"></label><div class=row><button onclick=pvw()>Preview</button><button id=sv class=p onclick=saveInv()>${EI?'Save changes':'Save'}</button><button onclick=close()>Cancel</button></div>`,true);rl();pk()}
function draft(){const t=tots(),c=S.cu.find(x=>x.id==$('#ic').value)||{name:$('#nn').value,phone:$('#np').value};return{workshop:S.ws,invoice:{kind:$('#kd').value,number:EI?CUR.i.number:'',date:EI?CUR.i.date:new Date().toISOString().slice(0,10),subtotal:t.s,gst:t.g,total:t.t,tractor:$('#tr').value,meter:$('#mt').value,notes:$('#nt').value},customer:c,lines:IL,paid:EI?CUR.i.paid:n($('#rc').value)}}
function pvw(){if(!IL.length)return alert('Add at least one line.');$('#pv').innerHTML=`<div class="box wide"><div class="row np"><button class=p onclick="$('#pv').className='';saveInv()">Save</button><button onclick="$('#pv').className=''">Back to edit</button></div>${a4(draft())}</div>`;$('#pv').className='on'}
async function saveInv(){const b=$('#sv');if(b.disabled)return;b.disabled=true;b.textContent='Saving…';await _saveInv();b.disabled=false;b.textContent='Save'}
async function _saveInv(){if(!IL.length)return alert('Add at least one line.');let cid=$('#ic').value||null;
 if(!cid&&$('#nn').value){const r=await sb.from('customers').insert({workshop_id:S.ws.id,name:$('#nn').value,phone:$('#np').value||null}).select().single();if(!ok(r))return;cid=r.data.id}
 if(EI&&n(CUR.i.paid)>0&&!confirm('This invoice has payments recorded. Save changes anyway?'))return;
 const t=tots(),b={customer_id:cid,subtotal:t.s,gst:t.g,total:t.t,notes:$('#nt').value||null,tractor:$('#tr').value||null,meter:$('#mt').value||null};let r;
 if(EI){b.edited_at=new Date().toISOString();r=await sb.from('invoices').update(b).eq('id',EI).select().single();if(!ok(r))return;if(!ok(await sb.from('invoice_lines').delete().eq('invoice_id',EI)))return}
 else{r=await sb.from('invoices').insert({...b,kind:$('#kd').value,workshop_id:S.ws.id}).select().single();if(!ok(r))return}
 const x=await sb.from('invoice_lines').insert(IL.map(l=>({item_id:l.item_id||null,description:l.description,gst_rate:n(l.gst_rate),invoice_id:r.data.id,workshop_id:S.ws.id,qty:n(l.qty),rate:n(l.rate)})));if(!ok(x))return;
 if(!EI&&n($('#rc').value)>0)await sb.from('payments').insert({invoice_id:r.data.id,workshop_id:S.ws.id,amount:n($('#rc').value)});close();EI=null;render()}
async function showInv(id){try{const i=S.inv.find(x=>x.id==id),[l,p]=await Promise.all([sb.from('invoice_lines').select('*').eq('invoice_id',id),sb.from('payments').select('*').eq('invoice_id',id).order('paid_on')]);
 CUR={i,l:l.data||[],p:p.data||[]};const c=S.cu.find(x=>x.id==i.customer_id)||{name:i.customer_name},q=i.kind=='quote',bal=n(i.total)-n(i.paid),can=i.status!='cancelled';
 modal(`<div class="row np">${can?`<button class=p onclick="newInv('${id}')">Edit</button>`:''}${can&&q?`<button class=p onclick="conv('${id}')">Convert to invoice</button>`:''}${can&&!q&&bal>0?`<button onclick="pay('${id}',${bal})">Add payment</button>`:''}<button onclick="wa('${id}')">WhatsApp</button><button onclick="navigator.clipboard.writeText(lk(CUR.i));this.textContent='Link copied'">Copy link</button><button onclick=pr()>Print / PDF</button>${can?`<button onclick="cancelInv('${id}')">Cancel</button>`:''}<button onclick=close()>Close</button></div>${a4({workshop:S.ws,invoice:i,customer:c,lines:CUR.l,paid:i.paid})}${CUR.p.length?`<div class=np><h3>Payments</h3>${CUR.p.map(x=>`<small>${x.paid_on}: ${f(x.amount)} (${x.mode})</small>`).join('')}</div>`:''}`,true)}catch(x){alert('Could not open: '+x.message)}}
function pay(id,bal){form('Add payment',[['amount','Amount','number',bal],['mode','Mode','select','upi',['cash','upi','cheque','bank']]],async d=>{if(ok(await sb.from('payments').insert({...d,invoice_id:id,workshop_id:S.ws.id}))){close();render()}})}
async function conv(id){if(ok(await sb.from('invoices').update({kind:'invoice'}).eq('id',id))){close();render()}}
async function cancelInv(id){if(confirm('Cancel this invoice? Stock is restored and it stays in your records.')&&ok(await sb.from('invoices').update({status:'cancelled'}).eq('id',id))){close();render()}}
function remind(k){const L=S.inv.filter(i=>live(i)&&st(i)!='Paid'&&(i.customer_id||'x')==k),c=S.cu.find(x=>x.id==k)||{},t=L.reduce((s,i)=>s+n(i.total)-n(i.paid),0);open(`https://wa.me/${ph(c.phone)}?text=`+encodeURIComponent(`Hello ${c.name||''}, a gentle reminder from ${S.ws.name}: ${f(t)} is pending (${L.map(i=>i.number).join(', ')}).${S.ws.upi?' Pay by UPI: '+S.ws.upi:''} Thank you.`))}
function logoUp(){const x=document.createElement('input');x.type='file';x.accept='image/*';x.onchange=()=>{const im=new Image();im.onload=async()=>{const k=Math.min(1,320/im.width),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const r=await sb.from('workshops').update({logo:cv.toDataURL('image/png')}).eq('id',S.ws.id).select().single();if(ok(r)){S.ws=r.data;render(false)}};im.src=URL.createObjectURL(x.files[0])};x.click()}
function wa(id){const i=S.inv.find(x=>x.id==id),c=S.cu.find(x=>x.id==i.customer_id);let ph=(c?.phone||'').replace(/\D/g,'');if(ph.length==10)ph='91'+ph;
 open(`https://wa.me/${ph}?text=${encodeURIComponent(`Hello${c?' '+c.name:''}, invoice ${i.number} from ${S.ws.name}: total ${f(i.total)}, balance ${f(n(i.total)-n(i.paid))}. View: ${lk(i)}`)}`)}
function wsForm(first){const w=first?{}:S.ws;form(first?'Set up your workshop':'Workshop profile',[['name','Workshop name','text',w.name],['address','Address line','text',w.address],['city','City','text',w.city],['state','State','text',w.state],['pincode','Pincode','text',w.pincode],['phone','Phone','text',w.phone],['upi','UPI ID','text',w.upi],['prefix','Invoice prefix','text',w.prefix||'INV'],['gst_enabled','GST registered (issue tax invoices)','check',w.gst_enabled],['gstin','GSTIN (only if registered)','text',w.gstin],['terms','Terms (shown on invoice)','text',w.terms],['bank','Bank details (shown on invoice)','text',w.bank],['lang','Invoice language: en, hi (Hindi), mr (Marathi)','select',w.lang||'en',['en','hi','mr']]],async d=>{const r=first?await sb.from('workshops').insert(d).select().single():await sb.from('workshops').update(d).eq('id',S.ws.id).select().single();if(ok(r)){S.ws=r.data;close();render()}})}
function authView(){app.innerHTML=`<main class=auth><h2>Workshop Billing</h2><input id=em type=email placeholder=Email autocomplete=email><input id=pw type=password placeholder=Password autocomplete=current-password onkeydown="event.key=='Enter'&&au('in')"><label class=sp><input type=checkbox onchange="$('#pw').type=this.checked?'text':'password'"> Show password</label><button class=p onclick="au('in')">Sign in</button><button onclick="au('up')">Create account</button></main>`}
async function au(k){const c={email:$('#em').value,password:$('#pw').value},r=k=='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);if(r.error)return alert(r.error.message);if(!r.data.session)return alert('Confirm your email, then sign in.');boot()}
async function pub(t){const{data:d}=await sb.rpc('public_invoice',{t});if(!d)return app.innerHTML='<main><p>Invoice not found.</p></main>';app.innerHTML='<div class=np style="text-align:center;padding:10px"><button class=p onclick=print()>Print / save PDF</button></div>'+a4(d)}
addEventListener('hashchange',()=>location.reload());
async function boot(){if(!CFG)return app.innerHTML='<main><h2>Setup needed</h2><p>Open index.html in a text editor and replace YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY near the top of the script with your project values. If you already did, check your internet connection (the Supabase script did not load).</p></main>';
 if(location.hash.startsWith('#i/'))return pub(location.hash.slice(3));
 const{data:{session}}=await sb.auth.getSession();if(!session)return authView();
 const r=await sb.from('workshops').select('*').limit(1);if(!ok(r))return;if(!r.data.length)return wsForm(true);S.ws=r.data[0];render()}
boot();
</script></body></html>
